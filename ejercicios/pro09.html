<!DOCTYPE html>

<head><meta charset="UTF-8"><title>Reto 9</title><link rel="stylesheet" href="css/estilos.css"></head>
<body>
    <a href="index.html" class="volver">Volver al inicio</a>
    <h1>9. Conversión de soles a dólares</h1>
    <script>
        let soles = Number(prompt("Monto en soles:"));
        let tipoCambio = Number(prompt("Tipo de cambio del dólar:"));
        
        let dolares = soles / tipoCambio;
        document.write("<p>El monto equivale a: US$ " + dolares + "</p>");
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Reto 5</title><link rel="stylesheet" href="css/estilos.css"></head>
<body>
    <a href="index.html" class="volver">Volver al inicio</a>
    <h1>5. Descuento en una tienda</h1>
    <script>
        let precio = Number(prompt("Precio del producto:"));
        let descuento = precio * 0.15;
        let precioFinal = precio - descuento;
        
        document.write("<p>Monto del descuento: S/ " + descuento + "</p>");
        document.write("<p>Precio final a pagar: S/ " + precioFinal + "</p>");
    </script>
</body>
</html>

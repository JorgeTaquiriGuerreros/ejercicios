<body>

    <h1>2. Compra de útiles escolares</h1>
    <script>
        let precioCuaderno = Number(prompt("Precio de un cuaderno:"));
        let cantCuaderno = Number(prompt("Cantidad de cuadernos:"));
        let precioLapicero = Number(prompt("Precio de un lapicero:"));
        let cantLapicero = Number(prompt("Cantidad de lapiceros:"));
        
        let total = (precioCuaderno * cantCuaderno) + (precioLapicero * cantLapicero);
        document.write("<p>El total de la compra es: S/ " + total + "</p>");
    </script>
</body>
</html>

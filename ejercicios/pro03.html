    <h1>3. Cálculo de edad</h1>

        let añoNacimiento = Number(prompt("Año de nacimiento:"));
        let edad = 2026 - añoNacimiento;
        
        document.write("<p>Tu edad aproximada es: " + edad + " años.</p>");
    </script>

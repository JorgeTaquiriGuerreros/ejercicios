<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Reto 4</title><link rel="stylesheet" href="css/estilos.css"></head>
<body>
    <a href="index.html" class="volver">Volver al inicio</a>
    <h1>4. Promedio de notas</h1>
    <script>
        let nota1 = Number(prompt("Ingresa la primera nota:"));
        let nota2 = Number(prompt("Ingresa la segunda nota:"));
        let nota3 = Number(prompt("Ingresa la tercera nota:"));
        
        let promedio = (nota1 + nota2 + nota3) / 3;
        document.write("<p>El promedio final es: " + promedio + "</p>");
    </script>
</body>
</html>

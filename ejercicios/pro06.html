    <h1>6. Cuenta de una cena</h1>
    <script>
        let cuenta = Number(prompt("Monto total de la cuenta:"));
        let personas = Number(prompt("Cantidad de personas:"));
        
        let pagoPorPersona = cuenta / personas;
        document.write("<p>Cada persona debe pagar: S/ " + pagoPorPersona + "</p>");
    </script>
</body>
